deploy:
  runs-on: ubuntu-latest
  needs: build
  environment: production

  steps:

    - name: Download WAR artifact
      uses: actions/download-artifact@v4
      with:
        name: myapp

    - name: Check WAR file
      run: |
        ls -la
        ls -la *.war

    - name: Test Tomcat connection
      run: |
        echo "Testing Tomcat connection..."
        curl -v \
          "http://${{ secrets.TOMCAT_HOST }}/manager/text/list"

    - name: Deploy WAR to Tomcat
      run: |
        WAR_FILE=$(ls *.war)

        echo "WAR file: $WAR_FILE"

        curl -v \
          -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          --upload-file "$WAR_FILE" \
          "http://${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"
