- name: Debug Tomcat connection
  env:
    TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
    TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
    TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
  run: |
    echo "===== TOMCAT HOST ====="
    printf '<%s>\n' "$TOMCAT_HOST"

    echo "===== TEST URL ====="
    printf '<http://%s/manager/text/list>\n' "$TOMCAT_HOST"

    echo "===== DNS TEST ====="
    getent hosts "$TOMCAT_HOST" || true

    echo "===== CURL TEST ====="
    curl -v \
      -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
      "http://$TOMCAT_HOST/manager/text/list"
