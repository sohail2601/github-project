name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check project
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Project directory:"
          ls -la github-actions-project-6pm-main
          echo "pom.xml location:"
          find github-actions-project-6pm-main -name pom.xml

      - name: Build with Maven
        working-directory: github-actions-project-6pm-main
        run: |
          mvn clean package -DskipTests

      - name: Find WAR file
        run: |
          echo "WAR files:"
          find github-actions-project-6pm-main/target -name "*.war" -type f

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: github-actions-project-6pm-main/target/*.war


  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      - name: Check downloaded WAR
        run: |
          echo "Downloaded files:"
          ls -la
          echo "WAR files:"
          ls -la *.war

      - name: Test Tomcat connection
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          echo "Testing Tomcat server..."
          echo "Tomcat host: $TOMCAT_HOST"
          curl -v "http://$TOMCAT_HOST/manager/text/list"

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(ls *.war)

          echo "Deploying $WAR_FILE to Tomcat..."

          curl -v \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "http://$TOMCAT_HOST/manager/text/deploy?path=/myapp&update=true"
